server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA com react-router (BrowserRouter): qualquer rota que não seja um arquivo real cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # assets com hash no nome (Vite) podem ter cache longo; index.html nunca (precisa sempre buscar o
  # bundle novo depois de um deploy).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
