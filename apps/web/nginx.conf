server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS embutido do Docker: resolve o nome da API a cada 10 s, em vez de uma vez só na subida — um redeploy
  # da API troca o IP do container, e com o proxy_pass fixo o Nginx continuaria mandando para o IP antigo.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API da plataforma pela rede interna (mesmo papel do proxy /api-localle do vite.config.ts em dev): o
  # navegador só fala com este Nginx, a API não precisa de domínio público nem de CORS.
  # ${API_UPSTREAM} é trocado na subida pelo envsubst da imagem oficial do Nginx (templates/), padrão no Dockerfile.
  location /api-localle/ {
    set $api_upstream http://${API_UPSTREAM};
    rewrite ^/api-localle/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # /realtime/stream é SSE: sem buffer e com leitura longa, senão o Nginx segura os eventos ou corta a conexão.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 10m;
  }

  # SPA com react-router (BrowserRouter): qualquer rota que não seja um arquivo real cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # assets com hash no nome (Vite) podem ter cache longo; index.html nunca (precisa sempre buscar o
  # bundle novo depois de um deploy).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
