name: fila

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - fila-redis-data:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'   # em VPS de produção, não publicar; só apps/api (mesma VPS-APP) alcança
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fila-redis-data:
